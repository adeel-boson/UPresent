services:
  postgres:
    image: postgres:16-alpine
    container_name: upresent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upresent
      POSTGRES_PASSWORD: upresent
      POSTGRES_DB: upresent
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a locally installed
      # Postgres. The container's own port stays 5432.
      - "5433:5432"
    volumes:
      - upresent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upresent -d upresent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  upresent-postgres-data:
